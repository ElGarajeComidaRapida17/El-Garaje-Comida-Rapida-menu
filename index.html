<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taply No-Code Builder - Web Version</title>
  <!-- Tailwind CSS por CDN para los estilos sin instalar dependencias -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 h-screen w-screen flex flex-col overflow-hidden font-sans">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header class="h-14 bg-white border-b px-6 flex items-center justify-between z-10">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 bg-blue-600 rounded-full"></div>
      <h1 class="font-bold text-base text-gray-900">Taply Builder - Web App Demo</h1>
    </div>
    <button onclick="exportJSON()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition-all">
      Exportar Configuración JSON
    </button>
  </header>

  <!-- ÁREA DE TRABAJO PRINCIPAL -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- PANEL IZQUIERDO: HERRAMIENTAS -->
    <aside class="w-80 bg-white border-r p-4 overflow-y-auto flex flex-col gap-6">
      <div>
        <h3 class="font-semibold text-xs uppercase tracking-wider text-gray-400 mb-3">Añadir Bloques</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="addBlock('HEADER')" class="p-2 border rounded-lg text-xs font-medium text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition-all text-left">
            + Encabezado
          </button>
          <button onclick="addBlock('BANNER')" class="p-2 border rounded-lg text-xs font-medium text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition-all text-left">
            + Banner
          </button>
          <button onclick="addBlock('PRODUCTS')" class="p-2 border rounded-lg text-xs font-medium text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition-all text-left">
            + Productos
          </button>
          <button onclick="addBlock('SOCIALS')" class="p-2 border rounded-lg text-xs font-medium text-gray-700 hover:bg-blue-50 hover:border-blue-300 transition-all text-left">
            + Redes / WA
          </button>
        </div>
      </div>

      <hr class="border-gray-100">

      <div>
        <h3 class="font-semibold text-xs uppercase tracking-wider text-gray-400 mb-3">Estilos Globales</h3>
        <div class="flex flex-col gap-3">
          <div>
            <label class="text-xs text-gray-600 block mb-1">Color Principal</label>
            <input type="color" id="primaryColorInput" value="#2563eb" onchange="updateTheme('primaryColor', this.value)" class="w-full h-9 rounded border border-gray-200 p-1 cursor-pointer">
          </div>
          <div>
            <label class="text-xs text-gray-600 block mb-1">Color de Fondo PWA</label>
            <input type="color" id="backgroundColorInput" value="#ffffff" onchange="updateTheme('backgroundColor', this.value)" class="w-full h-9 rounded border border-gray-200 p-1 cursor-pointer">
          </div>
        </div>
      </div>
    </aside>

    <!-- PANEL CENTRAL: VISTA PREVIA MÓVIL (CANVAS) -->
    <div class="flex-1 bg-gray-100 flex items-center justify-center p-4 overflow-y-auto">
      <div id="phoneMockup" class="w-[360px] h-[700px] rounded-[36px] shadow-2xl border-[8px] border-gray-900 overflow-y-auto relative flex flex-col transition-all bg-white">
        <!-- Notch del Teléfono -->
        <div class="w-28 h-4 bg-gray-900 mx-auto rounded-b-xl sticky top-0 z-50"></div>
        
        <!-- Contenedor del contenido dinámico -->
        <div id="phoneContent" class="flex-1 pb-6"></div>
      </div>
    </div>

    <!-- PANEL DERECHO: INSPECTOR DE PROPIEDADES -->
    <aside id="editorSidebar" class="w-80 bg-white border-l p-4 overflow-y-auto">
      <div class="text-center text-gray-400 text-xs mt-12">
        Haz clic en cualquier bloque de la vista previa para editar sus propiedades.
      </div>
    </aside>

  </div>

  <!-- LÓGICA DE LA APLICACIÓN (VANILLA JAVASCRIPT) -->
  <script>
    // Estado global en memoria
    let storeConfig = {
      slug: 'mi-tienda',
      theme: {
        primaryColor: '#2563eb',
        backgroundColor: '#ffffff'
      },
      blocks: [
        {
          id: 'b1',
          type: 'HEADER',
          data: {
            title: 'Mi Tienda Digital',
            subtitle: 'Catálogo de productos y servicios',
            logoUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
          }
        },
        {
          id: 'b2',
          type: 'PRODUCTS',
          data: {
            items: [
              { id: 'p1', name: 'Producto 1', price: 12.50, imageUrl: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300' },
              { id: 'p2', name: 'Producto 2', price: 25.00, imageUrl: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300' }
            ]
          }
        },
        {
          id: 'b3',
          type: 'SOCIALS',
          data: {
            whatsappNumber: '593991234567',
            instagramUser: 'mitienda'
          }
        }
      ]
    };

    let activeBlockId = 'b1';

    // Función principal para renderizar la interfaz
    function renderApp() {
      const phoneContent = document.getElementById('phoneContent');
      const phoneMockup = document.getElementById('phoneMockup');
      
      phoneMockup.style.backgroundColor = storeConfig.theme.backgroundColor;
      phoneContent.innerHTML = '';

      storeConfig.blocks.forEach(block => {
        const isActive = block.id === activeBlockId;
        const wrapper = document.createElement('div');
        wrapper.className = `relative cursor-pointer transition-all ${isActive ? 'ring-2 ring-blue-500 ring-offset-1' : 'hover:ring-1 hover:ring-gray-300'}`;
        wrapper.onclick = () => selectBlock(block.id);

        let htmlContent = '';

        if (block.type === 'HEADER') {
          htmlContent = `
            <header class="text-center py-6 px-4">
              ${block.data.logoUrl ? `<img src="${block.data.logoUrl}" class="w-20 h-20 mx-auto rounded-full object-cover mb-3 shadow">` : ''}
              <h1 class="text-xl font-bold text-gray-900">${block.data.title || 'Nombre de tienda'}</h1>
              <p class="text-xs text-gray-500 mt-1">${block.data.subtitle || ''}</p>
            </header>
          `;
        } else if (block.type === 'BANNER') {
          htmlContent = `
            <div class="w-full my-2 px-4">
              <img src="${block.data.imageUrl || 'https://via.placeholder.com/600x200'}" class="w-full h-36 object-cover rounded-xl shadow-sm">
            </div>
          `;
        } else if (block.type === 'PRODUCTS') {
          const items = block.data.items || [];
          let productsHTML = items.map(item => `
            <div class="bg-white rounded-lg p-2.5 border shadow-sm flex flex-col justify-between">
              <div>
                <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" class="w-full h-24 object-cover rounded-md mb-2">
                <span class="font-semibold text-xs text-gray-800 block truncate">${item.name}</span>
              </div>
              <div>
                <span class="text-xs font-bold mt-1 block" style="color: ${storeConfig.theme.primaryColor}">$${Number(item.price).toFixed(2)}</span>
                <button style="background-color: ${storeConfig.theme.primaryColor}" class="mt-2 w-full text-white text-[10px] py-1 px-2 rounded font-medium">Pedir</button>
              </div>
            </div>
          `).join('');

          htmlContent = `<div class="grid grid-cols-2 gap-2.5 p-4">${productsHTML || '<p class="text-xs text-gray-400 col-span-2 text-center">Catálogo vacío</p>'}</div>`;
        } else if (block.type === 'SOCIALS') {
          htmlContent = `
            <div class="p-4 flex flex-col gap-2">
              ${block.data.whatsappNumber ? `<button class="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-semibold text-xs shadow">Enviar Pedido por WhatsApp</button>` : ''}
              ${block.data.instagramUser ? `<div class="w-full py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl font-semibold text-xs shadow text-center">@${block.data.instagramUser}</div>` : ''}
            </div>
          `;
        }

        wrapper.innerHTML = htmlContent;
        phoneContent.appendChild(wrapper);
      });

      renderSidebarEditor();
    }

    // Renderiza el panel de edición según el bloque seleccionado
    function renderSidebarEditor() {
      const editorSidebar = document.getElementById('editorSidebar');
      const activeBlock = storeConfig.blocks.find(b => b.id === activeBlockId);

      if (!activeBlock) {
        editorSidebar.innerHTML = `<div class="text-center text-gray-400 text-xs mt-12">Haz clic en un bloque para editarlo.</div>`;
        return;
      }

      let formHTML = `
        <div class="flex justify-between items-center border-b pb-2 mb-4">
          <h3 class="font-bold text-sm text-gray-800">Editar: ${activeBlock.type}</h3>
          <button onclick="removeBlock('${activeBlock.id}')" class="text-xs text-red-500 font-medium">Eliminar</button>
        </div>
      `;

      if (activeBlock.type === 'HEADER') {
        formHTML += `
          <div class="flex flex-col gap-3">
            <div>
              <label class="text-xs font-medium text-gray-600 block mb-1">Título</label>
              <input type="text" value="${activeBlock.data.title || ''}" oninput="updateBlockData('title', this.value)" class="w-full border rounded-lg p-2 text-xs">
            </div>
            <div>
              <label class="text-xs font-medium text-gray-600 block mb-1">Subtítulo</label>
              <input type="text" value="${activeBlock.data.subtitle || ''}" oninput="updateBlockData('subtitle', this.value)" class="w-full border rounded-lg p-2 text-xs">
            </div>
            <div>
              <label class="text-xs font-medium text-gray-600 block mb-1">URL de Logo</label>
              <input type="text" value="${activeBlock.data.logoUrl || ''}" oninput="updateBlockData('logoUrl', this.value)" class="w-full border rounded-lg p-2 text-xs">
            </div>
          </div>
        `;
      } else if (activeBlock.type === 'BANNER') {
        formHTML += `
          <div>
            <label class="text-xs font-medium text-gray-600 block mb-1">URL de Imagen Banner</label>
            <input type="text" value="${activeBlock.data.imageUrl || ''}" oninput="updateBlockData('imageUrl', this.value)" class="w-full border rounded-lg p-2 text-xs">
          </div>
        `;
      } else if (activeBlock.type === 'PRODUCTS') {
        formHTML += `
          <button onclick="addProduct()" class="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2 rounded-lg text-xs font-semibold mb-3">+ Añadir Producto</button>
          <div class="flex flex-col gap-2">
            ${(activeBlock.data.items || []).map((prod, idx) => `
              <div class="p-2 border rounded-lg bg-gray-50 flex flex-col gap-1">
                <span class="text-[10px] font-bold text-gray-400">Producto #${idx + 1}</span>
                <input type="text" value="${prod.name}" oninput="updateProduct(${idx}, 'name', this.value)" placeholder="Nombre" class="border rounded p-1 text-xs">
                <input type="number" value="${prod.price}" oninput="updateProduct(${idx}, 'price', parseFloat(this.value) || 0)" placeholder="Precio" class="border rounded p-1 text-xs">
              </div>
            `).join('')}
          </div>
        `;
      } else if (activeBlock.type === 'SOCIALS') {
        formHTML += `
          <div class="flex flex-col gap-3">
            <div>
              <label class="text-xs font-medium text-gray-600 block mb-1">WhatsApp</label>
              <input type="text" value="${activeBlock.data.whatsappNumber || ''}" oninput="updateBlockData('whatsappNumber', this.value)" class="w-full border rounded-lg p-2 text-xs">
            </div>
            <div>
              <label class="text-xs font-medium text-gray-600 block mb-1">Instagram Usuario</label>
              <input type="text" value="${activeBlock.data.instagramUser || ''}" oninput="updateBlockData('instagramUser', this.value)" class="w-full border rounded-lg p-2 text-xs">
            </div>
          </div>
        `;
      }

      editorSidebar.innerHTML = formHTML;
    }

    // Funciones de interacción
    function selectBlock(id) {
      activeBlockId = id;
      renderApp();
    }

    function addBlock(type) {
      const newId = 'b_' + Date.now();
      let defaultData = {};

      if (type === 'HEADER') defaultData = { title: 'Nuevo Título', subtitle: 'Descripción' };
      if (type === 'BANNER') defaultData = { imageUrl: 'https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=600' };
      if (type === 'PRODUCTS') defaultData = { items: [] };
      if (type === 'SOCIALS') defaultData = { whatsappNumber: '593991234567' };

      storeConfig.blocks.push({ id: newId, type, data: defaultData });
      activeBlockId = newId;
      renderApp();
    }

    function removeBlock(id) {
      storeConfig.blocks = storeConfig.blocks.filter(b => b.id !== id);
      activeBlockId = storeConfig.blocks.length > 0 ? storeConfig.blocks[0].id : null;
      renderApp();
    }

    function updateBlockData(key, value) {
      const activeBlock = storeConfig.blocks.find(b => b.id === activeBlockId);
      if (activeBlock) {
        activeBlock.data[key] = value;
        renderApp();
      }
    }

    function addProduct() {
      const activeBlock = storeConfig.blocks.find(b => b.id === activeBlockId);
      if (activeBlock && activeBlock.type === 'PRODUCTS') {
        if (!activeBlock.data.items) activeBlock.data.items = [];
        activeBlock.data.items.push({
          id: 'p_' + Date.now(),
          name: 'Nuevo Producto',
          price: 10.00,
          imageUrl: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300'
        });
        renderApp();
      }
    }

    function updateProduct(index, field, value) {
      const activeBlock = storeConfig.blocks.find(b => b.id === activeBlockId);
      if (activeBlock && activeBlock.data.items[index]) {
        activeBlock.data.items[index][field] = value;
        renderApp();
      }
    }

    function updateTheme(key, value) {
      storeConfig.theme[key] = value;
      renderApp();
    }

    function exportJSON() {
      alert("JSON de la aplicación generada:\n\n" + JSON.stringify(storeConfig, null, 2));
    }

    // Inicializar aplicación al cargar la página
    renderApp();
  </script>
</body>
</html>
